services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mediledger
      POSTGRES_USER: mediledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediledger"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      APP_MODE: PUBLIC_DEMO
      DATABASE_URL: ${HOSTED_DATABASE_URL:?Set HOSTED_DATABASE_URL}
      FIXTURE_PASSWORD: ${FIXTURE_PASSWORD:?Set FIXTURE_PASSWORD}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      PORT: "3001"
      DEMO_FIXTURES_ONLY: "true"
      DEMO_ACCOUNT_ENTRY: "true"
    volumes:
      - pdfs:/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-ec",
        "npm run db:migrate && npm run seed -w @mediledger/api && npm run start -w @mediledger/api",
      ]
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_DEMO_ENTRY: "true"
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  postgres:
  pdfs:
