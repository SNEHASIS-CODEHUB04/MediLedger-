services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mediledger
      POSTGRES_USER: mediledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediledger"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres:
